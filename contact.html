<body>

<header class="site-header">
    <nav aria-label="Main navigation">
        <a href="index.html" class="logo" aria-label="Chinmay Jangid Home">
            CJ

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>

<main id="main-content">

    <section aria-labelledby="contact-heading">

        <h1 id="contact-heading">Contact Me</h1>

        <p>
            Have a question or project idea? Send me a message.
        </p>

        <form action="#" method="post" aria-labelledby="contact-heading">

            <div>
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true"
                >
            </div>

            <div>
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                    inputmode="email"
                >
            </div>

            <div>
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required
                    aria-required="true"
                >
            </div>

            <div>
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true"
                ></textarea>
            </div>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>
